[settings]
all_compile = false
lockfile = true

[tools]
# NOTE: Hugo
go = "1.27"
hugo = "0.169"
# NOTE: Linters and formatters
oxfmt = "0.78"
tombi = "1"
# NOTE: Utils
prek = "0.5"

[tasks.install]
description = "Install all dependencies"
alias = "i"
run = ["mise --locked install", "hugo mod vendor", "prek install"]

[tasks.dev]
description = "Run Hugo dev server"
run = "hugo serve"
